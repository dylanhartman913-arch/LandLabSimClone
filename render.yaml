# Free MP-01 preview. Review durable hosting before competition submission.
services:
  - type: web
    name: terra-homestead
    repo: https://github.com/dylanhartman913-arch/LandLabSimClone
    branch: codex/mp-01-hosted-room
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:hosted
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
