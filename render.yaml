# One service for the approved multiplayer branch; review the paid plan before applying.
services:
  - type: web
    name: terra-homestead
    repo: https://github.com/dylanhartman913-arch/LandLabSimClone
    branch: codex/mp-01-hosted-room
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build:hosted
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
