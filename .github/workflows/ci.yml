name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pacing:
    # CLAUDE.md rule 9: the playtest bots must pass their pacing gates (3 seeds × 3 sites).
    name: Pacing gates (playtest bots)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pacing gates
        run: npm run test:pacing

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Catalog in sync with xlsx
        run: npm run catalog:check
      - name: Unit, parity, conservation, determinism
        run: npx vitest run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Find Chromium for Lighthouse
        id: chrome
        run: echo "path=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_OUTPUT"
      - name: Build web
        run: npm run build
      - name: Upload preview build (download the artifact and open index.html, or serve the folder)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-pr-${{ github.event.pull_request.number }}
          path: apps/web/dist
          retention-days: 14
      - name: Lighthouse budget (first load, accessibility)
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
      - name: End-to-end (vite preview)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            docs/screenshots/
            test-results/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
